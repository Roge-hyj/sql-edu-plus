name: sql-edu-native-engines

# Development and integration-test database pool. The FastAPI process connects
# through PARSEVAL_*_URL and never receives access to the Docker socket.
services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: parseval_dev_root
      MYSQL_DATABASE: parseval
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    networks: [judge_internal]
    logging:
      options: {max-size: "10m", max-file: "2"}

  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: parseval_dev_root
      POSTGRES_DB: parseval
      TZ: UTC
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    networks: [judge_internal]
    logging:
      options: {max-size: "10m", max-file: "2"}

  sqlserver:
    profiles: ["full"]
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Parseval_Dev_2026!
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:11433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 512
    networks: [judge_internal]
    logging:
      options: {max-size: "10m", max-file: "2"}

  oracle:
    profiles: ["full"]
    image: gvenzl/oracle-free:23.7-slim-faststart
    environment:
      ORACLE_PASSWORD: Parseval_Dev_2026!
    ports:
      - "127.0.0.1:11521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 512
    networks: [judge_internal]
    logging:
      options: {max-size: "10m", max-file: "2"}

networks:
  judge_internal:
    # Docker Desktop does not publish host ports for an internal-only bridge.
    # Service ports remain bound to loopback above and are not LAN-accessible.
    driver: bridge
